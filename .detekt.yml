comments:
  # The public API is documented (Dokka, on the website): tests and internal code need not be
  UndocumentedPublicClass:
    active: true
    excludes: ['**/*Test/**']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/*Test/**']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/*Test/**']

complexity:
  TooManyFunctions:
    # JavaBigIntegerAdapter/JavaBigDecimalAdapter implement the (large) BigInteger/BigDecimal interfaces
    ignoreOverridden: true

style: {}
